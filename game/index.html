<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 3 L20 14 L29 16 L20 18 L16 29 L12 18 L3 16 L12 14 Z' fill='%230e7c86'/%3E%3C/svg%3E">
<title>Archipelago Airlift — a flight game</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0d2a3d; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Archipelago Airlift: fly an island-hopper over a tropical archipelago. Steer with the mouse or arrow keys, W and S for throttle, G for landing gear, F for flaps."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
